name: Download and audit Australian Energy Statistics 2025

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/download_australian_energy_statistics.py'
      - '.github/workflows/download-australian-energy-statistics.yml'

permissions:
  contents: write

concurrency:
  group: australian-energy-statistics-2025
  cancel-in-progress: true

jobs:
  energy-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow attempt
        run: |
          mkdir -p model_ready_inputs/reference/australian_energy_statistics_2025
          cat > model_ready_inputs/reference/australian_energy_statistics_2025/latest_attempt.json <<EOF
          {"run_id": ${GITHUB_RUN_ID}, "run_attempt": ${GITHUB_RUN_ATTEMPT}, "commit_sha": "${GITHUB_SHA}", "artifact": "australian-energy-statistics-2025-model-inputs"}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add model_ready_inputs/reference/australian_energy_statistics_2025/latest_attempt.json
          git commit -m "Record Australian Energy Statistics workflow attempt" || true
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install bounded dependencies
        run: pip install pandas openpyxl requests
      - name: Download and audit official Tables B F and L
        run: python scripts/download_australian_energy_statistics.py
      - name: Upload official energy-statistics package
        uses: actions/upload-artifact@v4
        with:
          name: australian-energy-statistics-2025-model-inputs
          path: model_ready_inputs/reference/australian_energy_statistics_2025
          retention-days: 90
          if-no-files-found: error
      - name: Commit workbooks, audit and run metadata
        run: |
          cat > model_ready_inputs/reference/australian_energy_statistics_2025/latest_run.json <<EOF
          {"run_id": ${GITHUB_RUN_ID}, "run_attempt": ${GITHUB_RUN_ATTEMPT}, "commit_sha": "${GITHUB_SHA}", "artifact": "australian-energy-statistics-2025-model-inputs"}
          EOF
          git pull --rebase
          git add model_ready_inputs/reference/australian_energy_statistics_2025
          git commit -m "Store official Australian Energy Statistics model inputs" || exit 0
          git push
