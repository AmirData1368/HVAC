name: Prepare and validate Ausgrid source-load archetypes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_ausgrid_load_archetypes.py'
      - 'scripts/prepare_ausgrid_load_archetypes_v2.py'
      - 'requirements-load-transfer.txt'
      - '.github/workflows/prepare-ausgrid-load-archetypes.yml'

permissions:
  actions: read
  contents: write

jobs:
  prepare-load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: '30434262791'
      SOURCE_ARTIFACT: 'regional-nsw-microgrid-data-bundle-v6'
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow attempt
        run: |
          mkdir -p load_transfer/results
          cat > load_transfer/results/preparation_latest_attempt.json <<EOF
          {"run_id": ${GITHUB_RUN_ID}, "run_attempt": ${GITHUB_RUN_ATTEMPT}, "commit_sha": "${GITHUB_SHA}", "source_data_run_id": ${SOURCE_RUN_ID}, "artifact": "ausgrid-source-load-archetype-preparation-v1"}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add load_transfer/results/preparation_latest_attempt.json
          git commit -m "Record Ausgrid load preparation attempt" || true
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-load-transfer.txt
      - name: Install dependencies
        run: pip install -r requirements-load-transfer.txt
      - name: Download and verify immutable validated data bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir source_artifact
          cd source_artifact
          sha256sum -c regional_nsw_microgrid_data_bundle_v6.tar.gz.sha256
          mkdir -p ../validated_bundle
          tar -xzf regional_nsw_microgrid_data_bundle_v6.tar.gz -C ../validated_bundle
      - name: Prepare source-domain daily and station-year archetype features
        run: |
          find load_transfer/results -type f ! -name preparation_latest_attempt.json -delete
          python scripts/prepare_ausgrid_load_archetypes_v2.py \
            --input-root validated_bundle/bundle_v6/raw/ausgrid_zone_substation_load/extracted \
            --output-dir load_transfer/results
      - name: Upload full source-load preparation package
        uses: actions/upload-artifact@v4
        with:
          name: ausgrid-source-load-archetype-preparation-v1
          path: |
            load_transfer/README.md
            load_transfer/results
          compression-level: 6
          retention-days: 90
      - name: Commit compact QC outputs and run metadata
        run: |
          cat > load_transfer/results/preparation_latest_run.json <<EOF
          {"run_id": ${GITHUB_RUN_ID}, "run_attempt": ${GITHUB_RUN_ATTEMPT}, "commit_sha": "${GITHUB_SHA}", "source_data_run_id": ${SOURCE_RUN_ID}, "artifact": "ausgrid-source-load-archetype-preparation-v1"}
          EOF
          git add load_transfer/results/ausgrid_file_qc.csv load_transfer/results/ausgrid_station_continuity.csv load_transfer/results/ausgrid_preparation_failures.csv load_transfer/results/ausgrid_schema_audit.json load_transfer/results/load_archetype_preparation_audit.json load_transfer/results/preparation_latest_run.json
          git commit -m "Store Ausgrid source-load quality and archetype preparation audit" || exit 0
          git pull --rebase
          git push
