name: Validate model-ready scientific inputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'model_ready_inputs/**'
      - 'scripts/validate_model_ready_inputs.py'
      - 'scripts/validate_fuel_logistics.py'
      - 'scripts/validate_target_load_scaling_protocol.py'
      - '.github/workflows/validate-model-ready-inputs.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record validation attempt
        run: |
          mkdir -p model_ready_validation
          cat > model_ready_validation/latest_attempt.json <<EOF
          {"run_id": ${GITHUB_RUN_ID}, "run_attempt": ${GITHUB_RUN_ATTEMPT}, "commit_sha": "${GITHUB_SHA}", "package_artifact": "regional-nsw-model-ready-scientific-inputs-v1", "diagnostic_artifact": "regional-nsw-model-ready-input-validation"}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add model_ready_validation/latest_attempt.json
          git commit -m "Record model-ready input validation attempt" || true
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate schemas, bounds and scientific governance rules
        run: |
          python scripts/validate_model_ready_inputs.py
          python scripts/validate_fuel_logistics.py
          python scripts/validate_target_load_scaling_protocol.py
      - name: Upload validated model-ready input package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: regional-nsw-model-ready-scientific-inputs-v1
          path: |
            model_ready_inputs
            model_ready_validation
          retention-days: 90
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-nsw-model-ready-input-validation
          path: model_ready_validation
          if-no-files-found: warn
          retention-days: 90
      - name: Record latest successful validation run and reports
        if: success()
        run: |
          cat > model_ready_validation/latest_run.json <<EOF
          {"run_id": ${GITHUB_RUN_ID}, "run_attempt": ${GITHUB_RUN_ATTEMPT}, "commit_sha": "${GITHUB_SHA}", "package_artifact": "regional-nsw-model-ready-scientific-inputs-v1", "diagnostic_artifact": "regional-nsw-model-ready-input-validation"}
          EOF
          git add model_ready_validation/latest_run.json model_ready_validation/model_ready_input_validation.json model_ready_validation/fuel_logistics_validation.json model_ready_validation/target_load_scaling_protocol_validation.json
          git commit -m "Store latest model-ready scientific input validation reports" || exit 0
          git pull --rebase
          git push
