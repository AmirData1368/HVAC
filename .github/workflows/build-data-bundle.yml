name: Build regional NSW microgrid data bundle v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_data_bundle_v4.py'
      - 'scripts/build_data_bundle_v2.py'
      - 'requirements.txt'
      - '.github/workflows/build-data-bundle.yml'

permissions:
  contents: read

env:
  START_YEAR: '2015'
  END_YEAR: '2025'
  SITE_LIMIT: '20'
  BUNDLE_ROOT: 'bundle_v4'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download, validate and audit official datasets
        run: python scripts/build_data_bundle_v4.py
      - name: Compress validated bundle
        if: success()
        run: |
          tar -czf regional_nsw_microgrid_data_bundle_v4.tar.gz bundle_v4
          sha256sum regional_nsw_microgrid_data_bundle_v4.tar.gz > regional_nsw_microgrid_data_bundle_v4.tar.gz.sha256
      - name: Upload validated bundle artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: regional-nsw-microgrid-data-bundle-v4
          path: |
            regional_nsw_microgrid_data_bundle_v4.tar.gz
            regional_nsw_microgrid_data_bundle_v4.tar.gz.sha256
          compression-level: 0
          retention-days: 30
      - name: Upload audit and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-nsw-data-audit-v4
          path: |
            bundle_v4/README.md
            bundle_v4/metadata
            bundle_v4/logs
          if-no-files-found: warn
          retention-days: 30
