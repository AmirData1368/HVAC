name: Build regional NSW microgrid data bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_data_bundle.py'
      - 'requirements.txt'
      - '.github/workflows/build-data-bundle.yml'

permissions:
  contents: read

env:
  NASA_START: '20150101'
  NASA_END: '20251231'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and validate official datasets
        run: python scripts/build_data_bundle.py
      - name: Compress bundle
        run: |
          tar -czf regional_nsw_microgrid_data_bundle.tar.gz bundle
          sha256sum regional_nsw_microgrid_data_bundle.tar.gz > regional_nsw_microgrid_data_bundle.tar.gz.sha256
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: regional-nsw-microgrid-data-bundle
          path: |
            regional_nsw_microgrid_data_bundle.tar.gz
            regional_nsw_microgrid_data_bundle.tar.gz.sha256
          compression-level: 0
          retention-days: 30
      - name: Upload manifest separately
        uses: actions/upload-artifact@v4
        with:
          name: regional-nsw-data-manifest
          path: |
            bundle/README.md
            bundle/metadata
            bundle/logs
          retention-days: 30
